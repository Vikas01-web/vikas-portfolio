     PAGE LOADER
========================================= -->

<div
    id="page-loader"
    class="page-loader"
    aria-hidden="true"
>

    <div class="loader-inner">

        <!-- Brand mark -->
        <div class="loader-mark">
            VK
        </div>

        <!-- Loading information -->
        <div class="loader-info">

            <div class="loader-topline">
                <span>INITIALIZING</span>
                <span id="loader-percent">00%</span>
            </div>

            <div class="loader-progress">
                <span id="loader-progress-bar"></span>
            </div>

        </div>

        <!-- Small system text -->
        <div class="loader-status">
            <span class="loader-dot"></span>

            <span id="loader-status-text">
                Loading portfolio
            </span>
        </div>

    </div>

</div>
